[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teacher-prosody"
version = "0.1.0"
description = "Measure, model and control how a teacher speaks while teaching (F0, rate, pauses, energy, emphasis, Hinglish) for cached AI lectures."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "praat-parselmouth>=0.4.3",
  "librosa>=0.10",
  "pyloudnorm>=0.1.1",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "PyYAML>=6",
  "jiwer>=3",
  "wordfreq>=3",
  "imageio-ffmpeg>=0.4.9",
  "jsonschema>=4",
]

[project.optional-dependencies]
# Real ASR / alignment / diarization / speaker-embedding backends. Need a GPU box
# (or patience on CPU) and network access to huggingface.co / download.pytorch.org.
asr = ["faster-whisper>=1.1", "whisperx>=3.3"]
align = ["torch>=2.3", "torchaudio>=2.3", "uroman>=1.3"]
diarize = ["pyannote.audio>=3.3"]
tts = ["requests>=2.31"]
dev = ["pytest>=8"]

[project.scripts]
tp = "teacher_prosody.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teacher_prosody = ["data/*.yaml", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
